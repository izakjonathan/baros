name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baros-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out baros
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate declared npm version
        run: |
          corepack enable npm
          test "$(npm --version)" = "10.9.2"

      - name: Check release artifacts before dependency installation
        run: npm run audit:artifacts

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run final stabilization preflight
        run: npm run audit:preflight

      - name: Validate release contract
        run: npm run validate:release

      - name: Run current regression suites
        run: npm run test:all

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate production environment contract
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@localhost:5432/barops
          APP_URL: https://barops.example
          DEV_AUTH_ENABLED: "false"
        run: npm run validate:env

      - name: Production build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@localhost:5432/barops
          APP_URL: https://barops.example
          DEV_AUTH_ENABLED: "false"
        run: npm run build
