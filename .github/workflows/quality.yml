name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baros-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: baros
          POSTGRES_PASSWORD: baros
          POSTGRES_DB: baros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baros -d baros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://baros:baros@localhost:5432/baros_test
    steps:
      - name: Check out baros
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression suites
        run: npm run test:all

      - name: Apply migrations to disposable PostgreSQL
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:migrate

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres-integration

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        env:
          DEV_AUTH_ENABLED: "true"
          DEV_AUTH_EMAIL: "ci@baros.local"
          DEV_AUTH_PASSWORD: "ci-development-password"
          DEV_AUTH_SECRET: "ci-only-development-secret-at-least-32-characters"
        run: npm run build
